<article class="prompt-detail" data-prompt-id="{{ID}}" data-prompt-title="{{TITLE}}" data-prompt-category="{{CATEGORY_KEY}}">
  <p class="crumb"><a href="{{HOME_HREF}}">← {{HOME_LABEL}}</a> · {{CATEGORY}}</p>
  <header class="prompt-header">
    <h1>{{TITLE}}</h1>
    {{MODE_BADGE}}
    {{FAVORITE_TOGGLE}}
    <p class="prompt-when">{{USE_WHEN}}</p>
    {{TAGS}}
  </header>

  {{DETAIL_BODY}}

  <p class="source-note">Source: <code>{{SOURCE}}</code></p>
</article>
