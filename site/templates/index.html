<section class="hero hero-home">
  <p class="hero-kicker">Operator kit · Jira Service Management</p>
  <div class="hero-brand" aria-hidden="true">
    <span class="hero-mark">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" width="72" height="72" focusable="false">
        <rect x="2.5" y="2.5" width="27" height="27" rx="4" stroke="currentColor" stroke-width="2"/>
        <rect x="8" y="8.5" width="11" height="3.25" rx="0.5" fill="currentColor"/>
        <rect x="8" y="14.25" width="14" height="3.25" rx="0.5" fill="currentColor"/>
        <rect x="8" y="20" width="16" height="3.25" rx="0.5" fill="currentColor"/>
        <rect class="mark-accent" x="21.5" y="21.5" width="5.5" height="5.5" rx="1" fill="currentColor"/>
      </svg>
    </span>
  </div>
  <h1 class="hero-title">
    <span class="hero-title-line">Rovo</span>
    <span class="hero-title-line">Agent Toolkit</span>
  </h1>
  <p class="hero-lead">Browse by situation, fill placeholders, copy, paste into Rovo.</p>
  <div class="hero-cta">
    <a class="btn" href="#catalog-search">Browse prompts</a>
    <a class="btn btn-quiet" href="commands.html">Commands</a>
  </div>
</section>

<p class="catalog-meta" aria-live="polite"><span id="catalog-count">{{COUNT}}</span> prompts in the kit</p>

<div id="recent-strip" class="recent-strip" data-recent-count="0" hidden>
  <h2 class="strip-heading">Recently used</h2>
  <div class="strip-items" id="recent-strip-items"></div>
</div>

<section id="favorites-strip" class="favorites-strip" hidden>
  <h2 class="strip-heading">Favorites</h2>
  <div class="strip-items" id="favorites-strip-items"></div>
</section>

<div id="situation-shortcuts" class="situation-shortcuts" aria-label="Situation shortcuts"></div>

<section class="toolbar" aria-label="Filter prompts">
  <label class="search-field">
    <span class="visually-hidden">Search</span>
    <input type="search" id="catalog-search" placeholder="Search title, situation, tags…" autocomplete="off" />
  </label>
</section>

{{CATEGORY_HUB}}

<section class="toolbar toolbar-tags" aria-label="Tag filters">
  <div class="tag-filters" id="tag-filters">
    <button type="button" class="tag-filter is-active" data-tag="">All</button>
    {{TAG_FILTERS}}
  </div>
  <p class="filter-status" id="filter-status" aria-live="polite"></p>
</section>

<div class="catalog" id="catalog" data-mode="browse">
  {{SECTIONS}}
</div>

<nav class="pager" id="pager" aria-label="Prompt pages" hidden></nav>

<noscript>
  <p class="noscript-note">Search, browse, and paging need JavaScript. All prompts are listed above.</p>
</noscript>
