<section class="hero">
  <h1>Queries</h1>
  <p class="hero-lead">Jira JQL snippets — fill placeholders, copy, paste into Jira or Rovo.</p>
  <p class="hero-meta"><span id="catalog-count">{{COUNT}}</span> queries</p>
</section>

<section class="toolbar" aria-label="Filter queries">
  <label class="search-field">
    <span class="visually-hidden">Search</span>
    <input type="search" id="catalog-search" placeholder="Search title, situation, tags…" autocomplete="off" />
  </label>
  <div class="tag-filters" id="tag-filters">
    <button type="button" class="tag-filter is-active" data-tag="">All</button>
    {{TAG_FILTERS}}
  </div>
  <p class="filter-status" id="filter-status" aria-live="polite"></p>
</section>

<div class="catalog" id="catalog" data-mode="filter" data-pager="off">
  {{SECTIONS}}
</div>

<noscript>
  <p class="noscript-note">Search and tag filters need JavaScript. All queries are listed above.</p>
</noscript>
